# Builds a reusable x86_64 dev-mode Buzz AppImage (`Buzz-dev_x86_64.AppImage`)
# whose Rust binary is compiled WITHOUT `tauri/custom-protocol`, so its WebView
# loads the frontend live from `http://localhost:1430` (`pnpm dev:desktop --port 1430`).
#
# Build this ONCE per upstream buzz-app tag (reusing buzz-release.yml's Cargo
# cache), then iterate on UI changes locally on omarchy (:60) in ~3 seconds via
# `run-dev-buzz.sh` without waiting for a full AppImage CI build.
name: buzz-dev-appimage

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buzz-dev-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dev:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      CARGO_HOME: /root/.cargo
      PNPM_STORE_DIR: /root/.local/share/pnpm/store
    steps:
      - name: Install build and packaging dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl desktop-file-utils file git \
            libasound2-dev libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev \
            libopus-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config \
            squashfs-tools wget xdg-utils zstd jq

      - uses: actions/checkout@v4

      - name: Compute dependency cache keys
        id: src
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          echo "cargo_hash=$(sha256sum Cargo.lock | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "pnpm_hash=$(sha256sum pnpm-lock.yaml | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        id: pnpm-cache
        uses: actions/cache/restore@v4
        with:
          path: /root/.local/share/pnpm/store
          key: pnpm-v1-x86_64-${{ steps.src.outputs.pnpm_hash }}
          restore-keys: pnpm-v1-x86_64-

      - name: Restore Cargo and target cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /root/.cargo/registry
            /root/.cargo/git
            target
          key: cargo-v1-x86_64-${{ steps.src.outputs.cargo_hash }}
          restore-keys: cargo-v1-x86_64-

      - name: Install pinned AppImage repacking tools
        run: |
          set -euo pipefail
          wget -q -O /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool' | sha256sum -c
          install -m 755 /tmp/appimagetool /usr/local/bin/appimagetool
          wget -q -O /tmp/appimage-runtime https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  /tmp/appimage-runtime' | sha256sum -c
          install -D -m 644 /tmp/appimage-runtime /usr/local/lib/appimage-runtime
          echo 'APPIMAGETOOL_RUNTIME_FILE=/usr/local/lib/appimage-runtime' >> "$GITHUB_ENV"

      - name: Build repaired AppImage skeleton and dev-URL binary
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR"

          # 1. Build the standard repaired AppImage so linuxdeploy bundles the exact
          #    runtime libraries, desktop entry, sidecars, and launcher shim.
          pnpm tauri build --ci --no-sign --bundles appimage \
            --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked
          shopt -s nullglob
          images=(target/release/bundle/appimage/*.AppImage)
          test "${#images[@]}" -eq 1
          bash scripts/fix-appimage.sh "${images[0]}"
          image="$(realpath "${images[0]}")"

          # 2. Build the Buzz binary WITHOUT `tauri/custom-protocol` so tauri::is_dev()
          #    is true and the WebView loads `http://localhost:1430` live from Vite.
          cargo build --release --manifest-path src-tauri/Cargo.toml --locked
          dev_bin="$PWD/target/release/Buzz"
          test -x "$dev_bin"
          grep -aqF "http://localhost:1430" "$dev_bin" || {
            echo "::error::dev binary does not reference http://localhost:1430"
            exit 1
          }

          # 3. Swap usr/bin/Buzz.bin inside the repaired AppImage and repack.
          work="$RUNNER_TEMP/dev-repack"
          mkdir -p "$work"
          (cd "$work" && "$image" --appimage-extract >/dev/null)
          install -m 755 "$dev_bin" "$work/squashfs-root/usr/bin/Buzz.bin"
          mkdir -p "$RUNNER_TEMP/dist"
          out="$RUNNER_TEMP/dist/Buzz-dev_x86_64.AppImage"
          ARCH=x86_64 appimagetool --runtime-file "$APPIMAGETOOL_RUNTIME_FILE" \
            "$work/squashfs-root" "$out"
          chmod +x "$out"
          ls -lh "$out"

      - name: Prune bulky intermediate outputs before saving Cargo cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf \
            target/release/bundle \
            target/release/incremental \
            target/buzz-cli-build

      - name: Save pnpm store cache
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /root/.local/share/pnpm/store
          key: pnpm-v1-x86_64-${{ steps.src.outputs.pnpm_hash }}

      - name: Save Cargo and target cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /root/.cargo/registry
            /root/.cargo/git
            target
          key: cargo-v1-x86_64-${{ steps.src.outputs.cargo_hash }}

      - uses: actions/upload-artifact@v4
        with:
          name: buzz-dev-x86_64
          path: ${{ runner.temp }}/dist/Buzz-dev_x86_64.AppImage
          compression-level: 0
          retention-days: 7
